name: AIReply

# ---------------------------------------------------------------------------
# SIGNING NOTE - read before changing DEVELOPMENT_TEAM.
#
# The checked-in AIReply.xcodeproj/project.pbxproj signs both targets with
# team JXM8N66QWU at TARGET level, which overrides the project-level team.
# An earlier version of this file said VMF4X4NF22 at target level, so running
# `xcodegen generate` would have silently re-signed the app with a different
# team. The target-level values below now match what actually ships.
#
# The project-level team is left as it was found. If JXM8N66QWU is the only
# correct team, set it in `settings.base` too and delete the per-target lines.
# ---------------------------------------------------------------------------

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    DEVELOPMENT_TEAM: VMF4X4NF22
    CODE_SIGN_STYLE: Automatic

targets:
  AIReply:
    type: application
    platform: iOS
    sources:
      - AIReply
      - Shared
    info:
      path: AIReply/Info.plist
      properties:
        CFBundleDisplayName: AI Reply
        NSMicrophoneUsageDescription: AI Reply uses the microphone only while you are dictating a reply, and only after you tap the voice button.
        NSSpeechRecognitionUsageDescription: AI Reply uses Apple speech recognition to turn your dictated reply into text.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Config/AIReply.entitlements
      properties:
        com.apple.security.application-groups:
          - group.kz.yerek.replykeyboard
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: kz.yerek.replykeyboard
      PRODUCT_NAME: AIReply
      DEVELOPMENT_TEAM: JXM8N66QWU
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "iPhone Developer"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: ReplyKeyboard
        embed: true

  AIReplyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: AIReply
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: kz.yerek.replykeyboard.tests
      DEVELOPMENT_TEAM: JXM8N66QWU
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AIReply.app/AIReply"
      BUNDLE_LOADER: "$(TEST_HOST)"

  ReplyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - ReplyKeyboard
      - Shared
    info:
      path: ReplyKeyboard/Info.plist
      properties:
        CFBundleDisplayName: AI Reply
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    entitlements:
      path: Config/ReplyKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.kz.yerek.replykeyboard
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: kz.yerek.replykeyboard.keyboard
      PRODUCT_NAME: ReplyKeyboardExtension
      DEVELOPMENT_TEAM: JXM8N66QWU
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: "1"
      APPLICATION_EXTENSION_API_ONLY: true
      SKIP_INSTALL: true

schemes:
  AIReply:
    build:
      targets:
        AIReply: all
        ReplyKeyboard: all
        AIReplyTests: [test]
    test:
      targets:
        - AIReplyTests
    run:
      config: Debug
